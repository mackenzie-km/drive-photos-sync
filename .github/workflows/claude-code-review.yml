name: Claude Auto Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read .claude/agents/code-reviewer.md in this checked-out repo first. Review this
            pull request following its review dimensions (correctness, security, project
            convention adherence, performance/reliability, code quality, test coverage) and
            its behavioral rules exactly - only review changed code, be direct, keep feedback
            proportional to the size of the change.

            Note: The PR branch is already checked out in the current working directory.

            For each issue with an unambiguous, mechanical fix (wrong variable, missing null
            check, drifted constant, obvious typo, etc.) - do not edit files directly. Instead
            post it via `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) on the exact line, with the comment body containing a
            ```suggestion
            <corrected code>
            ```
            fenced block, so it renders as a one-click "Apply suggestion" on the PR.

            For issues that need human judgment (design tradeoffs, missing test coverage,
            anything not mechanically fixable) - post a normal inline comment explaining the
            problem and pointing to a fix direction, with no suggestion block.

            Finish with one top-level summary comment via `gh pr comment`: overall assessment
            plus a verdict (Approve / Approve with suggestions / Request changes / Block),
            matching the code-reviewer agent's Output Format.

            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
